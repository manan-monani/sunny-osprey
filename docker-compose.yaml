services:
  # MQTT Broker
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: gazeguard-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - gazeguard-network
    restart: unless-stopped

  # Gazeguard Main Service
  gazeguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gazeguard
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./tests/data:/app/test_videos:rw
      - gazeguard_ready:/shared
      - ./prompt.txt:/app/prompt.txt:ro
      - ./system_prompt.txt:/app/system_prompt.txt:ro
      - ./gazeguard-config.yaml:/app/gazeguard-config.yaml:ro
      - ./.env:/app/.env:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: -1
              capabilities: [gpu]
    depends_on:
      - mqtt
    networks:
      - gazeguard-network
    restart: unless-stopped
    healthcheck:
      # Check for readiness file every 2 seconds for quick detection of fast startups
      # 300 retries × 2s interval = 10 minutes total for slow startups (model downloads)
      # First startup may take longer due to VLM model downloads from Hugging Face
      test: ["CMD", "test", "-f", "/shared/ready"]
      interval: 2s
      timeout: 1s
      retries: 300

  # Test Events Injector Service
  test-injector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gazeguard-test-injector
    environment:
      - MQTT_HOST=mqtt
      - MQTT_PORT=1883
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./tests/data:/app/test_videos:rw
      - gazeguard_ready:/shared
    command: ["/app/inject_test_events.sh"]
    depends_on:
      mqtt:
        condition: service_started
      gazeguard:
        condition: service_healthy
    networks:
      - gazeguard-network
    profiles:
      - inject_test_events

  # Optional: Frigate (if you want to run a local instance for testing)
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.16.0-beta3-tensorrt
    runtime: nvidia
    container_name: gazeguard-frigate
    shm_size: "512mb"
    ports:
      - "8971:8971"
    volumes:
      - ./frigate-config:/config:rw
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: -1
              capabilities: [gpu]
    networks:
      - gazeguard-network
    profiles:
      - frigate

  # RTSP Server for Laptop Webcam
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    networks:
      - gazeguard-network
    restart: unless-stopped
    profiles:
      - frigate
networks:
  gazeguard-network:

volumes:
  gazeguard_ready:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
