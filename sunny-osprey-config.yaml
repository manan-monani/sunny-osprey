# Sunny Osprey Configuration File - Webcam Edition v2.0
# Adapted for: 16GB RAM, RTX 2050 4GB VRAM, single laptop webcam
# LLM Backend: Gemma 4 E2B on llama.cpp (QAT Q4_0 + vision projector, fits 4GB VRAM)

# ── MQTT (kept for future Frigate integration) ──────────────────────────────
mqtt:
  enabled: false        # Disabled in webcam mode (no Frigate)
  host: mqtt
  port: 1883
  topic: frigate/events

# ── Frigate API (disabled in webcam mode) ───────────────────────────────────
frigate:
  api_base_url: http://frigate:5000

# ── Camera Filtering (Frigate mode only) ────────────────────────────────────
cameras:
  enabled_cameras: []   # Empty = all cameras

# ── Webcam Configuration ────────────────────────────────────────────────────
webcam:
  device_id: 0          # 0 = default/built-in webcam, 1 = external
  fps: 15               # Capture FPS (higher = smoother but more CPU)
  width: 1280           # Resolution (1280x720 = HD, good for detection)
  height: 720

# ── Motion Detection (MOG2 Background Subtraction) ──────────────────────────
motion:
  min_area: 1500         # Minimum contour area in pixels to trigger
                         # Tune: lower = more sensitive (more false triggers)
                         #       higher = less sensitive (may miss subtle motion)
  sensitivity: 50        # MOG2 varThreshold: lower = more sensitive
  cooldown_seconds: 12.0 # Minimum seconds between consecutive LLM inferences
                         # Prevents hammering the GPU during sustained motion
  clip_duration_seconds: 5  # Seconds of pre-event video to buffer

# ── LLM Server ───────────────────────────────────────────────────────────────
# Default: Gemma 4 E2B (smallest Gemma 4; QAT Q4_0 + vision projector) served by llama.cpp in Docker
# ("llm" service). It fits a 4 GB GPU and sees the camera frames.
# Inside Docker the OLLAMA_HOST / LLM_API env vars from docker-compose.webcam.yaml override these.
# To use Ollama instead: api: ollama, host: http://localhost:11434, model: llava-phi3
#   and start it with: docker compose -f docker-compose.webcam.yaml --profile ollama up -d
ollama:
  host: http://localhost:8081    # llama.cpp server as exposed on this laptop
  api: openai                    # "openai" (llama.cpp) or "ollama"
  model: gemma-4-E2B-it
  timeout: 120                   # Max seconds to wait for inference response

# ── LLM Configuration ───────────────────────────────────────────────────────
llm:
  backend: ollama               # "ollama" = HTTP model server (above), "huggingface" = in-process (needs 9GB+)
  prompt_file: prompt.txt
  model_name: gemma-4-E2B-it
  max_new_tokens: 300
  load_in_4bit: false

# ── Dashboard ────────────────────────────────────────────────────────────────
dashboard:
  url: http://localhost:8080    # Dashboard API URL (where webcam_capture.py posts events)

# ── Alert Configuration ──────────────────────────────────────────────────────
alerts:
  backend: all                  # "all", "ntfy", "telegram", or "grafana"
  send_all_activities: false    # true = alert on ALL events, false = suspicious only

  # Phone Push Notification & Alarm (ntfy.sh - Zero Setup, Free Mobile App)
  # Install 'ntfy' on phone from Play Store or App Store and subscribe to this topic
  ntfy:
    topic: sunny-osprey-security-alert
    server: https://ntfy.sh

  # Telegram Bot Alerts (Optional)
  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}

  # Grafana IRM (Optional)
  grafana:
    url: ${GRAFANA_URL}
    api_key: ${GRAFANA_API_KEY}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# ── Version ──────────────────────────────────────────────────────────────────
version: 2.0.0
