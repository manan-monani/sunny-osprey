# Sunny Osprey - Webcam Edition Docker Compose
# Designed for: 16GB RAM, RTX 2050 4GB VRAM, single laptop webcam. Everything runs in Docker.
#
# Architecture:
#   - llm:       Gemma 3n E2B (Q4_K_M + vision projector) on llama.cpp, GPU-accelerated
#   - mediamtx:  receives the webcam from a browser tab (WebRTC) and re-serves it as RTSP
#   - webcam:    capture -> MOG2 motion -> frame buffer -> Gemma 3n -> alerts (headless)
#   - dashboard: FastAPI web UI + real-time event feed
#   - ntfy:      private alert server; alerts show up in a browser tab (nothing goes to ntfy.sh)
#   - mqtt:      MQTT broker (for future Frigate integration)
#
# Docker Desktop on Windows cannot pass a USB webcam into containers, so the browser publishes it:
#   1. One-time model build (~11 GB download + ~10 min conversion; no Hugging Face token needed):
#        docker compose -f docker-compose.webcam.yaml --profile setup run --rm model-prep
#   2. Start everything:
#        docker compose -f docker-compose.webcam.yaml up -d --build
#   3. Open http://localhost:8889/webcam/publish, allow the camera and click "Publish" (keep the tab open)
#   4. Dashboard: http://localhost:8080   |   logs: docker compose -f docker-compose.webcam.yaml logs -f webcam
#   5. Alerts: open the ntfy topic URL from sunny-osprey-config.yaml (http://localhost:8090/<topic>)
#      and allow browser notifications
#
# Running the capture natively on Windows instead (with a local preview window) still works:
#   pip install -r requirements-native.txt && python src/sunny_osprey/webcam_capture.py
#   (it reaches the model at http://localhost:8081 per sunny-osprey-config.yaml); skip the webcam service:
#   docker compose -f docker-compose.webcam.yaml up -d llm dashboard

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:

  # ─── Gemma 3n LLM Server (llama.cpp) ──────────────────────────────────────
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: sunny-osprey-llm
    <<: *gpu
    # RAM cap: ~2 GB of the model (the token / per-layer embedding tables) stays on the CPU as a
    # memory-mapped file, yet each request reads only a few MB of rows. Under this cap the kernel keeps
    # just the rows in use (measured: 1.6 GB -> 1.0 GB resident, same speed and accuracy).
    mem_limit: 1536m
    ports:
      - "127.0.0.1:8081:8080"   # OpenAI-compatible API + chat UI at http://localhost:8081
    volumes:
      # Copied in by model-sync: reading 3.9 GB from the Windows folder (WSL file share, ~55 MB/s)
      # made every start take ~3 min once the VM stops caching it; a Docker volume reads ~7x faster
      - llm_models:/models:ro
    # Model files are switchable from .env, e.g. Gemma 4 E2B (faster, less accurate here; see
    # scripts/prepare_gemma4.sh):
    #   LLM_MODEL_FILE=gemma-4-E2B_q4_0-it.gguf
    #   LLM_MMPROJ_FILE=mmproj-gemma-4-E2B-it-Q8_0.gguf
    command:
      - --model
      - /models/${LLM_MODEL_FILE:-gemma-3n-E2B-it-Q4_K_M.gguf}
      - --mmproj
      - /models/${LLM_MMPROJ_FILE:-mmproj-gemma-3n-E2B-it-f16.gguf}
      - --alias
      - ${LLM_MODEL_ALIAS:-gemma-3n-E2B-it}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"        # one montage + prompt is ~750 tokens (Gemma 3n) / ~1500 (Gemma 4)
      - --parallel
      - "1"           # one inference at a time, like the webcam pipeline
      # RAM: every camera event is a new prompt, so prompt reuse never happens. Without these the
      # server keeps up to 8 GiB of old prompts (--cache-ram default) plus context checkpoints.
      - --cache-ram
      - "0"
      - --ctx-checkpoints
      - "0"
      # Auto-fit keeps 1 GiB of VRAM free by default, which left 15 of 31 layers on the CPU (slower,
      # more RAM). A 256 MiB margin puts all layers on the 4 GB GPU: ~5.7 s -> ~3.9 s per event.
      - --fit-target
      - "256"
      # Gemma 4 only (Gemma 3n uses a fixed 256 tokens per image): the default budget (~280) leaves
      # each frame of the 3x3 montage too small to judge; 1120 measured best (3/7 -> 4/7).
      - --image-min-tokens
      - "1120"
      - --image-max-tokens
      - "1120"
    depends_on:
      model-sync:
        condition: service_completed_successfully
    networks:
      - sunny-osprey-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─── Model sync (runs before llm) ─────────────────────────────────────────
  # Copies ./models/gguf/*.gguf into the llm_models volume when missing or changed (no-op otherwise)
  model-sync:
    image: python:3.12-slim
    container_name: sunny-osprey-model-sync
    volumes:
      - ./models/gguf:/src:ro
      - llm_models:/models
    command:
      - sh
      - -c
      - |
        for f in /src/*.gguf; do
          t=/models/$${f##*/}
          if [ ! -f "$$t" ] || [ "$$(stat -c%s "$$f")" != "$$(stat -c%s "$$t")" ]; then
            echo "copying $${f##*/}"; cp "$$f" "$$t.part" && mv "$$t.part" "$$t" || exit 1
          fi
        done
        echo "models in sync"
    restart: "no"

  # ─── One-time model build (profile: setup) ────────────────────────────────
  # Downloads Gemma 3n E2B and converts it to GGUF with llama.cpp's converter (text model + vision
  # projector); community Gemma 3n GGUFs predate llama.cpp's Gemma 3n vision support.
  model-prep:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    entrypoint: ["bash", "/scripts/prepare_model.sh"]
    volumes:
      - ./models:/models
      - ./scripts:/scripts:ro
    profiles:
      - setup

  # Alternative: download Gemma 4 E2B (~4 GB, official GGUFs)
  #   docker compose -f docker-compose.webcam.yaml --profile setup-gemma4 run --rm model-prep-gemma4
  model-prep-gemma4:
    image: python:3.12-slim
    entrypoint: ["sh", "/scripts/prepare_gemma4.sh"]
    volumes:
      - ./models:/models
      - ./scripts:/scripts:ro
    profiles:
      - setup-gemma4

  # ─── Webcam Relay (browser -> RTSP) ───────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    container_name: sunny-osprey-mediamtx
    mem_limit: 128m
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8889:8889"        # publish page: http://localhost:8889/webcam/publish
      - "127.0.0.1:8189:8189/udp"    # WebRTC media
      - "127.0.0.1:8189:8189/tcp"
      - "127.0.0.1:8554:8554"        # RTSP (e.g. view with VLC: rtsp://localhost:8554/webcam)
    networks:
      - sunny-osprey-network
    restart: unless-stopped

  # ─── Webcam Pipeline (headless) ───────────────────────────────────────────
  webcam:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunny-osprey-app
    container_name: sunny-osprey-webcam
    mem_limit: 768m   # 720p/1080p webcams use ~250 MB; headroom for 4K sources
    command: ["/venv/bin/python", "src/sunny_osprey/webcam_capture.py",
              "--config", "/app/sunny-osprey-config.yaml", "--no-preview"]
    environment:
      - PYTHONUNBUFFERED=1
      - WEBCAM_SOURCE=rtsp://mediamtx:8554/webcam
      - OLLAMA_HOST=http://llm:8080
      - LLM_API=openai
      - DASHBOARD_URL=http://dashboard:8080
      - ALERT_BACKEND=${ALERT_BACKEND:-}   # e.g. ALERT_BACKEND=none to only show events on the dashboard
      - NTFY_SERVER=http://ntfy:80
      - TZ=${TZ:-UTC}   # local time in logs/alerts; set TZ in .env (e.g. TZ=Asia/Kolkata)
      # One 720p stream needs few threads; by default FFmpeg/OpenCV/OpenBLAS start one per CPU core
      # (57 threads here), each with its own buffers
      # RTSP over TCP: UDP drops packets inside Docker's network and corrupts frames
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|threads;2
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=1
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src:ro
      - ./sunny-osprey-config.yaml:/app/sunny-osprey-config.yaml:ro
      - ./prompt.txt:/app/prompt.txt:ro
      - ./system_prompt.txt:/app/system_prompt.txt:ro
    depends_on:
      llm:
        condition: service_healthy
      mediamtx:
        condition: service_started
      dashboard:
        condition: service_started
      ntfy:
        condition: service_started
    networks:
      - sunny-osprey-network
    restart: unless-stopped

  # ─── Clip accuracy test (profile: test) ───────────────────────────────────
  # Classifies the curated clips in tests/data with the running llm service; fails on any miss.
  #   docker compose -f docker-compose.webcam.yaml --profile test run --rm clip-tests
  clip-tests:
    image: sunny-osprey-app
    environment:
      - OLLAMA_HOST=http://llm:8080
      - LLM_API=openai
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./tests/data:/app/test_videos:ro
      - ./sunny-osprey-config.yaml:/app/sunny-osprey-config.yaml:ro
      - ./prompt.txt:/app/prompt.txt:ro
      - ./system_prompt.txt:/app/system_prompt.txt:ro
      - ./pytest.ini:/app/pytest.ini:ro
    command: ["/venv/bin/python", "-m", "pytest", "tests/test_clip_accuracy.py", "-p", "no:cacheprovider"]
    depends_on:
      llm:
        condition: service_healthy
    networks:
      - sunny-osprey-network
    profiles:
      - test

  # ─── Dashboard Service ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunny-osprey-app
    container_name: sunny-osprey-dashboard
    mem_limit: 256m
    command: ["/venv/bin/python", "-m", "uvicorn", "sunny_osprey.dashboard:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"   # Web dashboard; shows the live camera, so this laptop only
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://llm:8080
      - LLM_API=openai
      - EVENTS_STORE_PATH=/app/events_store
      - TZ=${TZ:-UTC}
    volumes:
      - ./events_store:/app/events_store:rw        # Shared event storage
      - ./src:/app/src:ro                          # Code from the working tree (restart to apply edits)
      - ./dashboard:/app/dashboard:ro              # Dashboard static files
      - ./sunny-osprey-config.yaml:/app/sunny-osprey-config.yaml:ro
      - ./prompt.txt:/app/prompt.txt:ro
      - ./system_prompt.txt:/app/system_prompt.txt:ro
    depends_on:
      llm:
        condition: service_healthy
    networks:
      - sunny-osprey-network
    restart: unless-stopped

  # ─── Ollama (optional, profile: ollama) ───────────────────────────────────
  # Previous default, kept as an alternative backend (e.g. with llava-phi3):
  #   OLLAMA_MODEL=llava-phi3 docker compose -f docker-compose.webcam.yaml --profile ollama up -d ollama
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: sunny-osprey-ollama
    container_name: sunny-osprey-ollama
    <<: *gpu
    ports:
      - "11434:11434"   # Ollama REST API (accessible from Windows host)
    volumes:
      - ollama_models:/root/.ollama   # Persist downloaded models
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llava-phi3}
      - OLLAMA_KEEP_ALIVE=-1          # Keep model loaded in VRAM indefinitely
    networks:
      - sunny-osprey-network
    restart: unless-stopped
    profiles:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s   # Model pull can take time

  # ─── Private Alert Server (ntfy, self-hosted) ─────────────────────────────
  # Web app + notifications at http://localhost:8090; bound to this laptop only. Messages are kept
  # for 12 h, so alerts raised while the tab was closed show up when it is reopened.
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    container_name: sunny-osprey-ntfy
    mem_limit: 64m
    command: ["serve"]
    environment:
      - NTFY_BASE_URL=http://localhost:8090
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=12h
      - NTFY_ENABLE_LOGIN=false
    volumes:
      - ntfy_cache:/var/cache/ntfy
    ports:
      - "127.0.0.1:8090:80"
    networks:
      - sunny-osprey-network
    restart: unless-stopped

  # ─── MQTT Broker (for future Frigate integration) ──────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: sunny-osprey-mqtt
    mem_limit: 64m
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - sunny-osprey-network
    restart: unless-stopped

networks:
  sunny-osprey-network:
    driver: bridge

volumes:
  ollama_models:
    driver: local    # Persists across container restarts
  ntfy_cache:
    driver: local
  llm_models:
    driver: local    # GGUF copies for fast loading (see model-sync)
