# Sunny Osprey - Webcam Edition Docker Compose
# Designed for: 16GB RAM, RTX 2050 4GB VRAM, single laptop webcam. Everything runs in Docker.
#
# Architecture:
#   - llm:       Gemma 4 E2B (QAT Q4_0 + vision projector) on llama.cpp, GPU-accelerated
#   - mediamtx:  receives the webcam from a browser tab (WebRTC) and re-serves it as RTSP
#   - webcam:    capture -> MOG2 motion -> frame buffer -> Gemma 4 -> alerts (headless)
#   - dashboard: FastAPI web UI + real-time event feed
#   - mqtt:      MQTT broker (for future Frigate integration)
#
# Docker Desktop on Windows cannot pass a USB webcam into containers, so the browser publishes it:
#   1. One-time model download (~4 GB):
#        docker compose -f docker-compose.webcam.yaml --profile setup run --rm model-prep
#   2. Start everything:
#        docker compose -f docker-compose.webcam.yaml up -d --build
#   3. Open http://localhost:8889/webcam/publish, allow the camera and click "Publish" (keep the tab open)
#   4. Dashboard: http://localhost:8080   |   logs: docker compose -f docker-compose.webcam.yaml logs -f webcam
#
# Running the capture natively on Windows instead (with a local preview window) still works:
#   pip install -r requirements-native.txt && python src/sunny_osprey/webcam_capture.py
#   (it reaches the model at http://localhost:8081 per sunny-osprey-config.yaml); skip the webcam service:
#   docker compose -f docker-compose.webcam.yaml up -d llm dashboard

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:

  # ─── Gemma 4 LLM Server (llama.cpp) ───────────────────────────────────────
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: sunny-osprey-llm
    <<: *gpu
    ports:
      - "127.0.0.1:8081:8080"   # OpenAI-compatible API + chat UI at http://localhost:8081
    volumes:
      - ./models/gguf:/models:ro    # downloaded by the model-prep service
    # Model files are switchable from .env, e.g. Gemma 3n E2B (see scripts/prepare_gemma3n.sh):
    #   LLM_MODEL_FILE=gemma-3n-E2B-it-Q4_K_M.gguf
    #   LLM_MMPROJ_FILE=mmproj-gemma-3n-E2B-it-f16.gguf
    command:
      - --model
      - /models/${LLM_MODEL_FILE:-gemma-4-E2B_q4_0-it.gguf}
      - --mmproj
      - /models/${LLM_MMPROJ_FILE:-mmproj-gemma-4-E2B-it-Q8_0.gguf}
      - --alias
      - gemma-4-E2B-it
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --parallel
      - "1"           # one inference at a time, like the webcam pipeline
      # Gemma 4 sizes images by a token budget; the default (~280) leaves each frame of the
      # 3x3 montage too small to judge. 1120 measured best on the test clips (3/7 -> 4/7).
      - --image-min-tokens
      - "1120"
      - --image-max-tokens
      - "1120"
    networks:
      - sunny-osprey-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─── One-time model download (profile: setup) ─────────────────────────────
  # Fetches the Gemma 4 E2B GGUF + vision projector (pinned revisions) into ./models/gguf
  model-prep:
    image: python:3.12-slim
    entrypoint: ["sh", "/scripts/prepare_model.sh"]
    volumes:
      - ./models:/models
      - ./scripts:/scripts:ro
    profiles:
      - setup

  # Alternative: build Gemma 3n E2B GGUFs (download ~11 GB + conversion)
  model-prep-gemma3n:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    entrypoint: ["bash", "/scripts/prepare_gemma3n.sh"]
    volumes:
      - ./models:/models
      - ./scripts:/scripts:ro
    profiles:
      - setup-gemma3n

  # ─── Webcam Relay (browser -> RTSP) ───────────────────────────────────────
  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    container_name: sunny-osprey-mediamtx
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "127.0.0.1:8889:8889"        # publish page: http://localhost:8889/webcam/publish
      - "127.0.0.1:8189:8189/udp"    # WebRTC media
      - "127.0.0.1:8189:8189/tcp"
      - "127.0.0.1:8554:8554"        # RTSP (e.g. view with VLC: rtsp://localhost:8554/webcam)
    networks:
      - sunny-osprey-network
    restart: unless-stopped

  # ─── Webcam Pipeline (headless) ───────────────────────────────────────────
  webcam:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunny-osprey-app
    container_name: sunny-osprey-webcam
    command: ["/venv/bin/python", "src/sunny_osprey/webcam_capture.py",
              "--config", "/app/sunny-osprey-config.yaml", "--no-preview"]
    environment:
      - PYTHONUNBUFFERED=1
      - WEBCAM_SOURCE=rtsp://mediamtx:8554/webcam
      - OLLAMA_HOST=http://llm:8080
      - LLM_API=openai
      - DASHBOARD_URL=http://dashboard:8080
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src:ro
      - ./sunny-osprey-config.yaml:/app/sunny-osprey-config.yaml:ro
      - ./prompt.txt:/app/prompt.txt:ro
      - ./system_prompt.txt:/app/system_prompt.txt:ro
    depends_on:
      llm:
        condition: service_healthy
      mediamtx:
        condition: service_started
      dashboard:
        condition: service_started
    networks:
      - sunny-osprey-network
    restart: unless-stopped

  # ─── Dashboard Service ─────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunny-osprey-app
    container_name: sunny-osprey-dashboard
    command: ["/venv/bin/python", "-m", "uvicorn", "sunny_osprey.dashboard:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    ports:
      - "8080:8080"   # Web dashboard (open in browser)
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=http://llm:8080
      - LLM_API=openai
      - EVENTS_STORE_PATH=/app/events_store
    volumes:
      - ./events_store:/app/events_store:rw        # Shared event storage
      - ./src:/app/src:rw                          # Live code reload
      - ./dashboard:/app/dashboard:ro              # Dashboard static files
      - ./sunny-osprey-config.yaml:/app/sunny-osprey-config.yaml:ro
      - ./prompt.txt:/app/prompt.txt:ro
      - ./system_prompt.txt:/app/system_prompt.txt:ro
    depends_on:
      llm:
        condition: service_healthy
    networks:
      - sunny-osprey-network
    restart: unless-stopped

  # ─── Ollama (optional, profile: ollama) ───────────────────────────────────
  # Previous default, kept as an alternative backend (e.g. with llava-phi3):
  #   OLLAMA_MODEL=llava-phi3 docker compose -f docker-compose.webcam.yaml --profile ollama up -d ollama
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: sunny-osprey-ollama
    container_name: sunny-osprey-ollama
    <<: *gpu
    ports:
      - "11434:11434"   # Ollama REST API (accessible from Windows host)
    volumes:
      - ollama_models:/root/.ollama   # Persist downloaded models
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llava-phi3}
      - OLLAMA_KEEP_ALIVE=-1          # Keep model loaded in VRAM indefinitely
    networks:
      - sunny-osprey-network
    restart: unless-stopped
    profiles:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s   # Model pull can take time

  # ─── MQTT Broker (for future Frigate integration) ──────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: sunny-osprey-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - sunny-osprey-network
    restart: unless-stopped

networks:
  sunny-osprey-network:
    driver: bridge

volumes:
  ollama_models:
    driver: local    # Persists across container restarts
